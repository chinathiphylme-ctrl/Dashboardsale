<!DOCTYPE html>
<html lang="th"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hylme — เข้าสู่ระบบ</title>
<style>
  :root{
    --page:#f2f1ec; --surface:#ffffff; --text:#0b0b0b; --muted:#52514e;
    --border:rgba(11,11,11,0.12); --accent:#2a78d6; --accent-ink:#ffffff; --critical:#d03b3b;
    --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#0d0e10; --surface:#1e1f24; --text:#f2f2ef; --muted:#b7b7b2;
      --border:rgba(255,255,255,0.14); --accent:#3d84e6; --critical:#f07070;
    }
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    font-family:var(--font); background:var(--page); color:var(--text); -webkit-font-smoothing:antialiased; }
  .card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:22px; padding:28px 24px; box-shadow:0 10px 28px -14px rgba(20,20,18,0.2); }
  h1{ font-size:18px; margin:0 0 6px; }
  p{ margin:0 0 20px; color:var(--muted); font-size:13.5px; line-height:1.5; }
  label.pw{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=password]{ width:100%; padding:11px 12px; font:inherit; font-size:15px; color:var(--text);
    background:var(--page); border:1px solid var(--border); border-radius:12px; outline:none; }
  input[type=password]:focus{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .rem{ display:flex; align-items:center; gap:8px; margin:14px 0 18px; font-size:13px; color:var(--muted); }
  button{ width:100%; padding:12px; font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    color:var(--accent-ink); background:var(--accent); border:0; border-radius:12px; }
  button:disabled{ opacity:.6; cursor:progress; }
  #msg{ min-height:20px; margin-top:12px; font-size:13px; color:var(--critical); }
</style>
</head><body>
<main class="card">
  <h1>Hylme Dashboard</h1>
  <p>ข้อมูลในหน้านี้ถูกเข้ารหัส (AES-256) — ใส่รหัสผ่านเพื่อเปิดดู</p>
  <form id="hylmeLogin" autocomplete="on">
    <input type="text" name="username" value="hylme" autocomplete="username" hidden>
    <label class="pw" for="hylmePw">รหัสผ่าน</label>
    <input type="password" id="hylmePw" autocomplete="current-password" required autofocus>
    <label class="rem"><input type="checkbox" id="hylmeRemember"> จำรหัสไว้ในเครื่องนี้ (ไม่ต้องใส่ซ้ำ)</label>
    <button type="submit" id="hylmeGo">เปิดแดชบอร์ด</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script type="application/json" id="hylme-payload">/*__HYLME_PAYLOAD__*/</script>
<script>
(function(){
  const PLACEHOLDER = '/*__HYLME_PAYLOAD__*/';
  const REMEMBER_KEY = 'hylme_vault_key_v1';
  const payloadEl = document.getElementById('hylme-payload');

  // เก็บแม่แบบหน้านี้ไว้ (ตัดข้อมูลเข้ารหัสออก) ให้ปุ่ม "สร้างไฟล์เว็บ" ในแดชบอร์ดใช้ห่อไฟล์ใหม่
  const tplRoot = document.documentElement.cloneNode(true);
  tplRoot.querySelector('#hylme-payload').textContent = PLACEHOLDER;
  window.__hylmeLoaderTpl = '<!DOCTYPE html>\n' + tplRoot.outerHTML;

  const env = JSON.parse(payloadEl.textContent);
  const form = document.getElementById('hylmeLogin');
  const pwEl = document.getElementById('hylmePw');
  const remEl = document.getElementById('hylmeRemember');
  const goBtn = document.getElementById('hylmeGo');
  const msg = document.getElementById('msg');

  function b64d(s){ const bin = atob(s); const u8 = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
  function b64e(u8){ let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

  async function deriveKey(pw, salt, iter){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, true, ['encrypt', 'decrypt']);
  }
  async function decryptWith(key){
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(env.iv)}, key, b64d(env.ct));
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  function openDashboard(key, html){
    window.__hylmeVault = {key:key, salt:env.salt, iter:env.iter};
    document.open(); document.write(html); document.close();
  }

  async function tryRemembered(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null'); }catch(e){}
    if(!saved || saved.salt !== env.salt || saved.iter !== env.iter) return false;
    try{
      const key = await crypto.subtle.importKey('raw', b64d(saved.k), {name:'AES-GCM'}, true, ['encrypt', 'decrypt']);
      openDashboard(key, await decryptWith(key));
      return true;
    }catch(e){
      try{ localStorage.removeItem(REMEMBER_KEY); }catch(e2){}
      return false;
    }
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.textContent = '';
    goBtn.disabled = true; goBtn.textContent = 'กำลังถอดรหัส…';
    let key, html;
    try{
      key = await deriveKey(pwEl.value, b64d(env.salt), env.iter);
      html = await decryptWith(key);
    }catch(err){
      msg.textContent = 'รหัสผ่านไม่ถูกต้อง';
      goBtn.disabled = false; goBtn.textContent = 'เปิดแดชบอร์ด';
      pwEl.select();
      return;
    }
    if(remEl.checked){
      try{
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        localStorage.setItem(REMEMBER_KEY, JSON.stringify({salt:env.salt, iter:env.iter, k:b64e(raw)}));
      }catch(err){}
    }
    openDashboard(key, html);
  });

  if(!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined'){
    msg.textContent = 'เบราว์เซอร์นี้เก่าเกินไป — ใช้ Chrome / Edge / Safari / Firefox รุ่นล่าสุด (และต้องเปิดผ่าน https)';
    goBtn.disabled = true;
    return;
  }
  tryRemembered();
})();
</script>
</body></html>
